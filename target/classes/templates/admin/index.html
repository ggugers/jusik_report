<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="shell admin-grid">
    <section class="hero-card">
        <p class="eyebrow">ADMIN</p>
        <h1>수집 작업 실행</h1>
        <p class="hero-copy">리포트 종류와 날짜를 선택해 수집하고, 시가총액 동기화는 별도로 실행합니다.</p>
        <p class="flash" th:if="${message}" th:text="${message}"></p>
    </section>

    <section class="action-card">
        <h2>리포트 수집</h2>
        <form method="post" th:action="@{/admin/reports/crawl}" class="stack-form crawl-form">
            <label>
                <span>리포트 종류</span>
                <select name="reportType" required>
                    <option value="all" th:selected="${selectedReportType == null or selectedReportType == 'all'}">전체</option>
                    <option value="stock" th:selected="${selectedReportType == 'stock'}">종목 리포트</option>
                    <option value="industry" th:selected="${selectedReportType == 'industry'}">산업 리포트</option>
                    <option value="marketInfo" th:selected="${selectedReportType == 'marketInfo'}">시황정보 리포트</option>
                    <option value="invest" th:selected="${selectedReportType == 'invest'}">투자정보 리포트</option>
                    <option value="economy" th:selected="${selectedReportType == 'economy'}">경제분석 리포트</option>
                    <option value="debenture" th:selected="${selectedReportType == 'debenture'}">채권분석 리포트</option>
                </select>
            </label>
            <label>
                <span>수집 날짜</span>
                <input type="date" name="targetDate" th:value="${today}">
            </label>
            <label>
                <span>종목명</span>
                <input type="text" name="stockName" th:value="${selectedStockName}" placeholder="종목 리포트 선택 시에만 사용">
            </label>
            <button type="submit">수집 실행</button>
        </form>
        <div class="result-box" th:if="${crawlResult}">
            <p th:text="${'대상 날짜: ' + crawlResult.targetDate}">대상 날짜</p>
            <p th:text="${'저장: ' + crawlResult.savedCount + '건'}">저장</p>
            <p th:text="${'중복 제외: ' + crawlResult.skippedCount + '건'}">중복 제외</p>
            <p th:text="${'실패: ' + crawlResult.failedCount + '건'}">실패</p>
            <p th:text="${'방문 페이지: ' + crawlResult.visitedPages + '페이지'}">방문 페이지</p>
            <div class="result-breakdown" th:if="${crawlTypeSavedCounts != null and !crawlTypeSavedCounts.isEmpty()}">
                <p class="result-breakdown-title">종류별 신규 등록</p>
                <p class="result-breakdown-inline">
                    <span th:each="item, stat : ${crawlTypeSavedCounts}">
                        <span th:text="${item.label + ' : ' + item.savedCount + '건'}">리포트 : 0건</span><span th:if="${!stat.last}">, </span>
                    </span>
                </p>
            </div>
        </div>
    </section>

    <section class="action-card">
        <h2>시가총액 동기화</h2>
        <form method="post" th:action="@{/admin/market-caps/sync}" class="stack-form">
            <p class="muted">코스피와 코스닥 시가총액 정보를 동기화합니다.</p>
            <button type="submit">동기화 실행</button>
        </form>
        <div class="result-box" th:if="${syncResult}">
            <p th:text="${'신규 저장: ' + syncResult.savedCount + '건'}">신규 저장</p>
            <p th:text="${'갱신: ' + syncResult.updatedCount + '건'}">갱신</p>
            <p th:text="${'실패: ' + syncResult.failedCount + '건'}">실패</p>
            <p th:text="${'방문 페이지: ' + syncResult.visitedPages + '페이지'}">방문 페이지</p>
        </div>
    </section>

    <section class="action-card">
        <h2>바로가기</h2>
        <div class="actions">
            <a class="ghost-button" th:href="@{/reports}">종목 리포트</a>
            <a class="ghost-button" th:href="@{/industry-reports}">산업 리포트</a>
            <a class="ghost-button" th:href="@{/market-info-reports}">시황정보</a>
            <a class="ghost-button" th:href="@{/invest-reports}">투자정보</a>
            <a class="ghost-button" th:href="@{/economy-reports}">경제분석</a>
            <a class="ghost-button" th:href="@{/debenture-reports}">채권분석</a>
        </div>
    </section>
</main>
</body>
</html>
