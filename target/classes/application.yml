spring:
  datasource:
    url: jdbc:sqlite:${APP_DB_PATH:./data/jusik-report.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
  thymeleaf:
    cache: false
  web:
    resources:
      static-locations: ${STATIC_LOCATIONS:file:./src/main/resources/static/,classpath:/static/}
      cache:
        period: 0

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: warn
